name: Deploy to Timeweb S3

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync site files to Timeweb S3 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIMEWEB_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIMEWEB_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-1
        run: |
          aws --endpoint-url https://s3.twcstorage.ru s3 sync . "s3://${{ secrets.TIMEWEB_S3_BUCKET }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude ".superpowers/*" \
            --exclude "docs/*" \
            --exclude "README.md" \
            --exclude "ПЛАН-ПУБЛИКАЦИИ.md" \
            --exclude ".gitignore"
